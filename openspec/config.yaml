# openspec/config.yaml
schema: spec-driven

context: |
  AniNote: native Android anime list app (learning exercise; AI assists, user writes code).
  Kotlin 2.1.0 + Jetpack Compose + Material 3 (BOM 2024.12.01) + Room 2.6.1 (KSP) + DataStore Preferences 1.1.1.
  Single :app module, minSdk 28 / targetSdk 35, Java 11. No DI framework, no Navigation Compose.
  Architecture: manual wiring in MainActivity, Repository over Room DAO, ViewModels with StateFlow/SharedFlow,
  UiState data class, one-screen UI (Scaffold + LazyColumn + M3 dialogs/bottom sheets).
  Source of truth: design-brief.md (v3, Spanish). Code identifiers and UI copy in English unless the brief says otherwise.

strict_tdd: true

testing:
  runner: "JUnit 4 (local) + AndroidJUnitRunner (instrumented)"
  layers:
    unit: "JUnit 4.13.2 — app/src/test (placeholder ExampleUnitTest only)"
    integration: "none (no coroutines-test, no room-testing, no Robolectric)"
    ui: "androidx.compose.ui:ui-test-junit4 + espresso-core 3.6.1 + ui-test-manifest (debug) — app/src/androidTest (placeholder only)"
  coverage: "none"
  linter: "none"
  type_checker: "none (Kotlin compiler only)"
  formatter: "none"
  constraints: |
    AGENTS.md forbids the agent from running gradle/gradlew build or test commands.
    The user compiles, installs, and tests manually from Android Studio. Any phase
    that needs verification MUST produce manual verification checklists instead of
    executing tests, and MUST NOT set test/build commands.

rules:
  proposal:
    - Keep scope small; respect design-brief.md closed decisions
    - Read design-brief.md before proposing any change
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specs may be written in Spanish (matches design-brief.md) or English; pick per change and stay consistent
  design:
    - Follow design-brief.md architecture; no DI framework or Navigation Compose without explicit justification
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Never include gradle execution steps (AGENTS.md rule)
  apply:
    guidelines:
      - Follow existing patterns: manual ViewModelFactory, StateFlow + collectAsStateWithLifecycle, SharedFlow for one-shot events
      - Write tests first where unit-testable (strict TDD); user runs them manually
    tdd: true
    test_command: ""   # agent MUST NOT run gradle; user verifies in Android Studio
  verify:
    test_command: ""   # user executes tests manually
    build_command: ""  # user compiles manually (AGENTS.md)
    coverage_threshold: 0
    note: "Provide a manual verification checklist (what to tap, what to expect) for the user"
  archive:
    - Warn before merging destructive deltas
